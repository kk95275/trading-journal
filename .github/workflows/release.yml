name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run electron:compile

      - run: npm run build

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required on macOS for an unsigned build to succeed at all (not just to
          # avoid a warning) — without it electron-builder tries to find a signing
          # identity that doesn't exist and fails outright. Harmless on win/linux.
          CSC_IDENTITY_AUTO_DISCOVERY: false
